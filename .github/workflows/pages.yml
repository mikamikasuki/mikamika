name: Build and deploy profile
on:
  push:
    branches: [main]
    paths: ['content/**', 'photos/**', 'src/**', 'scripts/**', 'tests/**', 'assets/**', 'vendor/**', 'package*.json', 'playwright.config.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
  schedule:
    - cron: '27 12 * * *'
permissions:
  contents: read
concurrency:
  group: profile-pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Detect photo-only upload
        id: changes
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          if [ -n "$files" ]; then
            while IFS= read -r file; do
              case "$file" in photos/*) ;; *) exit 0 ;; esac
            done <<< "$files"
            echo 'photos_only=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.15.0'
          cache: npm
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: profile-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/content/photos.mjs') }}-${{ github.run_id }}
          restore-keys: |
            profile-build-${{ runner.os }}-${{ hashFiles('package-lock.json', 'src/content/photos.mjs') }}-
      - run: npm ci
      - name: Install HEIC decoder
        run: |
          python3 -m venv .heif-venv
          .heif-venv/bin/pip install --disable-pip-version-check pillow-heif==1.5.0
      - run: npx playwright install --with-deps chromium
        if: steps.changes.outputs.photos_only != 'true'
      - run: npm run verify
        if: steps.changes.outputs.photos_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          HEIC_PYTHON: .heif-venv/bin/python
      - name: Build and validate uploaded photos
        if: steps.changes.outputs.photos_only == 'true'
        run: npm run build && node scripts/validate-output.mjs
        env:
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
          HEIC_PYTHON: .heif-venv/bin/python
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
  refresh-readme:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          git fetch origin main
          git switch -C main origin/main
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          readme = Path('README.md')
          text = readme.read_text()
          text = re.sub(r'(assets/readme/profile-(?:light|dark)(?:-static)?\.svg)\?v=[^" ]+',
                        lambda match: f'{match.group(1)}?v={os.environ["GITHUB_RUN_ID"]}', text)
          readme.write_text(text)
          PY
          if ! git diff --quiet -- README.md; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add README.md
            git commit -m 'Refresh README image after deployment'
            git push origin HEAD:main
          fi
