<svg
  width="1200"
  height="138"
  viewBox="0 0 1200 138"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <filter id="textSoft" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="0.35" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cloudSoft" x="-30%" y="-40%" width="160%" height="180%">
      <feDropShadow
        dx="0"
        dy="2"
        stdDeviation="2"
        flood-color="#C0AAFF"
        flood-opacity="0.15"
      />
    </filter>
  </defs>


  <!-- LEFT CLOUD -->

  <g transform="translate(35, 0)">
    <g filter="url(#cloudSoft)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="
          0 7;
          4 -12;
          -3 -5;
          5 10;
          -2 1;
          0 7
        "
        keyTimes="0;0.21;0.43;0.66;0.85;1"
        dur="4.9s"
        repeatCount="indefinite"
      />

      <path
        shape-rendering="crispEdges"
        fill="#A997EA"
        d="
          M 9 37 H 3 V 31 H 6 V 25 H 12 V 19 H 18 V 16
          H 24 V 10 H 33 V 7 H 45 V 4 H 57 V 7 H 63
          V 13 H 69 V 16 H 75 V 13 H 81 V 10 H 93 V 13
          H 99 V 16 H 102 V 22 H 108 V 25 H 114 V 31
          H 117 V 37 H 114 V 43 H 108 V 46 H 99 V 49
          H 18 V 46 H 9 Z
        "
      />

      <g shape-rendering="crispEdges">
        <rect x="42" y="4" width="3" height="3" fill="#C0ACF8"/>
        <rect x="45" y="4" width="3" height="3" fill="#CCB7FC"/>
        <rect x="48" y="4" width="3" height="3" fill="#D8B9EE"/>
        <rect x="51" y="4" width="3" height="3" fill="#E6AFD0"/>

        <rect x="24" y="10" width="3" height="3" fill="#B49FF1"/>
        <rect x="30" y="7" width="3" height="3" fill="#C4AEF9"/>

        <rect x="81" y="10" width="3" height="3" fill="#E5B0D5"/>
        <rect x="90" y="10" width="3" height="3" fill="#CCA8EA"/>

        <rect x="3" y="31" width="3" height="3" fill="#B9A5F1"/>
        <rect x="111" y="31" width="3" height="3" fill="#EBAFD0"/>

        <rect x="27" y="46" width="3" height="3" fill="#C0ACF6"/>
        <rect x="42" y="46" width="3" height="3" fill="#D0BFF9"/>
        <rect x="60" y="46" width="3" height="3" fill="#E6BBDD"/>
        <rect x="81" y="46" width="3" height="3" fill="#C6ADF3"/>
        <rect x="99" y="46" width="3" height="3" fill="#E4AECD"/>
      </g>

      <path
        shape-rendering="crispEdges"
        fill="#CFC3F7"
        d="
          M 15 37 H 12 V 31 H 15 V 25 H 21 V 19 H 30
          V 16 H 39 V 13 H 54 V 16 H 60 V 22 H 66 V 28
          H 69 V 25 H 72 V 19 H 81 V 16 H 90 V 19 H 96
          V 22 H 99 V 28 H 105 V 34 H 102 V 40 H 96
          V 43 H 21 V 40 H 15 Z
        "
      />

      <g shape-rendering="crispEdges">
        <rect x="39" y="13" width="3" height="3" fill="#DDD1FF"/>
        <rect x="45" y="13" width="3" height="3" fill="#E7D2F5"/>
        <rect x="51" y="16" width="3" height="3" fill="#F0C9E1"/>
        <rect x="78" y="16" width="3" height="3" fill="#D9C7FA"/>
        <rect x="87" y="16" width="3" height="3" fill="#EEC3DB"/>
      </g>

      <path
        shape-rendering="crispEdges"
        fill="#25212D"
        d="
          M 21 37 H 18 V 31 H 24 V 25 H 30 V 22 H 36
          V 19 H 45 V 22 H 51 V 28 H 57 V 31 H 63 V 34
          H 69 V 31 H 72 V 25 H 78 V 22 H 87 V 25 H 93
          V 31 H 96 V 37 H 90 V 40 H 27 V 37 Z
        "
      />

      <g shape-rendering="crispEdges" opacity="0.83">
        <rect x="39" y="31" width="3" height="3" fill="#CFC3FF"/>
        <rect x="42" y="31" width="3" height="3" fill="#DACAFB"/>
        <rect x="45" y="31" width="3" height="3" fill="#E8C9F1"/>
        <rect x="48" y="31" width="3" height="3" fill="#EFC4DF"/>
        <rect x="51" y="31" width="3" height="3" fill="#DEC8F7"/>
        <rect x="54" y="31" width="3" height="3" fill="#C9BDFE"/>
      </g>

      <rect
        x="-8"
        y="44"
        width="3"
        height="3"
        fill="#BEAEF6"
        opacity="0.65"
        shape-rendering="crispEdges"
      />
    </g>
  </g>


  <!-- RIGHT CLOUD -->

  <g transform="translate(1043, 78)">
    <g filter="url(#cloudSoft)">
      <animateTransform
        attributeName="transform"
        type="translate"
        values="
          0 -8;
          -5 11;
          3 4;
          -4 -11;
          4 -1;
          0 -8
        "
        keyTimes="0;0.22;0.44;0.67;0.85;1"
        dur="5.8s"
        repeatCount="indefinite"
      />

      <path
        shape-rendering="crispEdges"
        fill="#AE9BE9"
        d="
          M 9 34 H 3 V 28 H 6 V 22 H 12 V 19 H 18 V 13
          H 27 V 10 H 36 V 7 H 48 V 4 H 60 V 7 H 66 V 13
          H 72 V 16 H 78 V 13 H 84 V 10 H 96 V 13 H 102
          V 16 H 105 V 22 H 111 V 25 H 117 V 31 H 120
          V 37 H 117 V 43 H 111 V 46 H 102 V 49 H 18
          V 46 H 9 Z
        "
      />

      <g shape-rendering="crispEdges">
        <rect x="45" y="4" width="3" height="3" fill="#C1ADF8"/>
        <rect x="48" y="4" width="3" height="3" fill="#D1B8F4"/>
        <rect x="51" y="4" width="3" height="3" fill="#DDB7E8"/>
        <rect x="54" y="4" width="3" height="3" fill="#E8AECF"/>

        <rect x="27" y="10" width="3" height="3" fill="#B7A2F0"/>
        <rect x="36" y="7" width="3" height="3" fill="#C6AFF7"/>

        <rect x="84" y="10" width="3" height="3" fill="#E6AFD2"/>
        <rect x="93" y="10" width="3" height="3" fill="#CDA7E9"/>

        <rect x="6" y="28" width="3" height="3" fill="#BDA8F3"/>
        <rect x="111" y="25" width="3" height="3" fill="#E5ACCD"/>
      </g>

      <path
        shape-rendering="crispEdges"
        fill="#D2C5F7"
        d="
          M 15 37 H 12 V 31 H 15 V 25 H 21 V 19 H 30
          V 16 H 39 V 13 H 54 V 16 H 60 V 22 H 66 V 28
          H 69 V 25 H 72 V 19 H 81 V 16 H 90 V 19 H 96
          V 22 H 99 V 28 H 105 V 34 H 102 V 40 H 96
          V 43 H 21 V 40 H 15 Z
        "
      />

      <path
        shape-rendering="crispEdges"
        fill="#25212D"
        d="
          M 21 37 H 18 V 31 H 24 V 25 H 30 V 22 H 36
          V 19 H 45 V 22 H 51 V 28 H 57 V 31 H 63 V 34
          H 69 V 31 H 72 V 25 H 78 V 22 H 87 V 25 H 93
          V 31 H 96 V 37 H 90 V 40 H 27 V 37 Z
        "
      />

      <g shape-rendering="crispEdges" opacity="0.82">
        <rect x="42" y="31" width="3" height="3" fill="#D0C4FF"/>
        <rect x="45" y="31" width="3" height="3" fill="#DCCBFA"/>
        <rect x="48" y="31" width="3" height="3" fill="#EAC9F0"/>
        <rect x="51" y="31" width="3" height="3" fill="#EFC3DE"/>
        <rect x="54" y="31" width="3" height="3" fill="#DEC7F5"/>
        <rect x="57" y="31" width="3" height="3" fill="#C9BCFD"/>
      </g>

      <rect
        x="126"
        y="43"
        width="3"
        height="3"
        fill="#C5AFF0"
        opacity="0.64"
        shape-rendering="crispEdges"
      />
    </g>
  </g>


  <!-- ambient pixels -->

  <g shape-rendering="crispEdges">
    <rect x="218" y="20" width="3" height="3" fill="#C9B7FF">
      <animate
        attributeName="opacity"
        values="0.15;0.78;0.15"
        dur="2.8s"
        repeatCount="indefinite"
      />
    </rect>

    <rect x="955" y="25" width="3" height="3" fill="#E8ACCF">
      <animate
        attributeName="opacity"
        values="0.16;0.76;0.16"
        dur="3.1s"
        repeatCount="indefinite"
      />
    </rect>
  </g>


  <!-- TEXT -->

  <text
    x="600"
    y="32"
    text-anchor="middle"
    font-family="Nunito, Quicksand, ui-rounded, 'Arial Rounded MT Bold', sans-serif"
    font-size="17"
    font-weight="700"
    fill="#F1A5C5"
    filter="url(#textSoft)"
  >
    🌷 CS undergraduate at Rutgers University, currently spending a one-year gap year in California.
  </text>

  <text
    x="600"
    y="69"
    text-anchor="middle"
    font-family="Nunito, Quicksand, ui-rounded, 'Arial Rounded MT Bold', sans-serif"
    font-size="17"
    font-weight="700"
    fill="#C1AEFF"
    filter="url(#textSoft)"
  >
    Next year, I’ll be heading to UT Austin for a Master’s in Computer Science on a full scholarship.
  </text>

  <text
    x="600"
    y="106"
    text-anchor="middle"
    font-family="Nunito, Quicksand, ui-rounded, 'Arial Rounded MT Bold', sans-serif"
    font-size="16.5"
    font-weight="700"
    fill="#E9A2C6"
    filter="url(#textSoft)"
  >
    I hope to use both my technical skills and my token budget to give back to the open-source community. ♡
  </text>
</svg>
