<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel configuration</title><link rel="stylesheet" href="./style.css"></head><body><main class="editor"><h1>Travel configuration</h1><p>Export configuration, then replace <code>content/travel.yaml</code>. Photos belong in the state folders.</p><form id="editor-form">
<label>State<select id="edit-state"></select></label><label>Visited<select id="visited"><option value="auto">Infer from photos</option><option value="true">Visited</option><option value="false">Do not publish</option></select></label><label class="wide">Cities / places (after Visited:)<input id="subtitle"></label><label>Color<input type="color" id="color"></label><label>Cover<select id="cover"><option value="">Automatic</option></select></label><label class="wide">Photo order (one existing filename per line)<textarea id="photo-order"></textarea></label><label>Preview state order (CA, NJ, …)<input id="preview-order"></label><label>Selected preview subset<select id="selection"><option value="stable">Stable order</option><option value="daily">Rotate daily</option></select></label><label>Initial pause (ms)<input id="initial-idle" type="number" min="0"></label><label>State cycle (ms)<input id="state-cycle" type="number" min="1"></label><label>Max preview states<input id="max-states" type="number" min="1" max="51"></label><label>Max preview photos<input id="max-photos" type="number" min="1" max="4"></label><label class="wide">Animation phases (JSON, milliseconds)<textarea id="phases"></textarea></label></form>
<div class="toolbar"><label>Import YAML<input type="file" id="import-yaml" accept=".yaml,.yml"></label><button id="export-yaml">Export configuration</button><button id="apply-yaml">Validate / apply YAML</button><button id="play-preview">Preview animation</button></div><p id="editor-status" role="status"></p><label>Travel YAML<textarea class="wide" id="yaml-source" style="width:100%;min-height:240px"></textarea></label><h2>Preview</h2><iframe id="editor-preview" src="./" title="Profile preview"></iframe><script type="module" src="./editor.js"></script></main></body></html>
